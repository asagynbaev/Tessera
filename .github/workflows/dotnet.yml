name: .NET Build and Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build the project
        run: dotnet build --configuration Release

      - name: Run tests
        run: dotnet test --configuration Release --no-build --verbosity normal

  soroban-contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chains/stellar

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust stable + wasm32
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Build attestation-verifier WASM (release)
        run: cargo build --target wasm32-unknown-unknown --release -p attestation-verifier

      - name: Run Rust contract tests
        run: cargo test -p attestation-verifier

  evm-contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chains/evm

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Compile contracts
        run: npx hardhat compile

      - name: Run contract tests
        run: npx hardhat test

      - name: Verify checked-in ABIs are up to date
        run: |
          npm run export-abi
          git diff --exit-code abi/