[toolchain]
anchor_version = "1.2.2"

[features]
skip-lint = false

[programs.localnet]
identity_registry = "11111111111111111111111111111114"

[programs.devnet]
identity_registry = "11111111111111111111111111111114"

[provider]
cluster = "devnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"

[workspace]
members = ["programs/identity-registry"]
